[package]
name = "store-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Franchisee and store setup for the Store App"
publish = false

[dependencies]
askama = "0.16.1"
axum = { version = "0.8.9", features = ["form"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
chrono = { version = "0.4.45", features = ["serde"] }
rcgen = "0.14.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
